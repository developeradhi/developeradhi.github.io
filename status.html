<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Zero-Latency Maintenance Overlay (No URL Redirects, No Flashing) -->
    <style id="maintenance-anti-flicker">
      body > *:not(#nexus-maintenance-overlay) { opacity: 0 !important; pointer-events: none; }
    </style>
    <script>
      const mStyle = document.createElement('style');
      mStyle.innerHTML = `
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap');

        #nexus-maintenance-overlay {
          position: fixed; inset: 0; z-index: 9999999;
          display: none; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden;
        }
        #nexus-maintenance-overlay.active { display: block !important; pointer-events: all !important; }

        /* ── LAYOUT ── */
        .m-layout { display: flex; width: 100vw; height: 100vh; }

        /* ── LEFT: Full-bleed city photo ── */
        .m-photo {
          flex: 0 0 52%;
          position: relative;
          background:
            url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=90&w=2400')
            center 40% / cover no-repeat;
        }
        .m-photo::after {
          content: '';
          position: absolute; inset: 0;
          background: linear-gradient(135deg, rgba(10,14,30,0.35) 0%, rgba(5,8,20,0.70) 100%);
        }
        /* Floating status pill on photo */
        .m-photo-badge {
          position: absolute; bottom: 2.5rem; left: 2.5rem; z-index: 2;
          display: flex; align-items: center; gap: 10px;
          padding: 10px 18px; border-radius: 100px;
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.15);
          backdrop-filter: blur(12px);
          color: #fff; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;
        }
        .m-pulse {
          width: 8px; height: 8px; border-radius: 50%; background: #f59e0b;
          box-shadow: 0 0 0 0 rgba(245,158,11,0.6);
          animation: ripple 1.6s ease-out infinite;
        }
        @keyframes ripple {
          0%   { box-shadow: 0 0 0 0 rgba(245,158,11,0.6); }
          70%  { box-shadow: 0 0 0 10px rgba(245,158,11,0); }
          100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
        }

        /* ── RIGHT: White minimal card ── */
        .m-panel {
          flex: 1;
          background: #ffffff;
          display: flex; flex-direction: column; justify-content: center;
          padding: 5rem 8% 4rem;
          position: relative;
          box-shadow: -30px 0 60px rgba(0,0,0,0.12);
          overflow-y: auto;
        }

        /* Wordmark top-LEFT — exactly like mockup */
        .m-wordmark {
          position: absolute; top: 2.5rem; left: 8%;
          font-size: 1rem; font-weight: 800; color: #0f172a; letter-spacing: -0.01em;
        }

        /* Label */
        .m-label {
          display: inline-flex; align-items: center; gap: 8px;
          padding: 7px 16px; border-radius: 100px;
          background: #fef9c3; border: 1px solid #fde68a;
          color: #92400e; font-size: 0.82rem; font-weight: 600;
          margin-bottom: 2rem; align-self: flex-start;
        }

        .m-panel h1 {
          font-size: clamp(2.8rem, 4.5vw, 4.2rem);
          font-weight: 900; color: #0f172a; line-height: 1.0;
          letter-spacing: -0.04em; margin-bottom: 1.5rem;
        }

        .m-panel p {
          font-size: 1rem; color: #64748b;
          line-height: 1.75; max-width: 420px; margin-bottom: 2.4rem;
        }

        /* Profile row — 3 lines exactly like mockup */
        .m-profile { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 2.4rem; max-width: 440px; }
        .m-avatar {
          width: 52px; height: 52px; border-radius: 50%;
          border: 2px solid #e2e8f0; flex-shrink: 0; object-fit: cover;
        }
        .m-profile-name { font-size: 1rem; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
        .m-profile-sub { font-size: 0.875rem; color: #475569; margin-bottom: 4px; }
        .m-profile-role { font-size: 0.82rem; color: #64748b; display: flex; align-items: center; gap: 6px; }
        .m-online-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; flex-shrink: 0; }

        /* CTA Button */
        .m-btn {
          display: inline-flex; align-items: center;
          background: #0f172a; color: #fff;
          padding: 14px 28px; border-radius: 8px;
          font-weight: 700; font-size: 0.95rem;
          text-decoration: none;
          transition: transform 0.15s, background 0.15s;
          align-self: flex-start;
        }
        .m-btn:hover { background: #1e293b; transform: translateY(-1px); }

        /* Mobile */
        @media (max-width: 860px) {
          .m-layout { flex-direction: column; }
          .m-photo { flex: 0 0 30vh; }
          .m-panel { padding: 4rem 6% 2rem; justify-content: flex-start; }
          .m-wordmark { top: 1.2rem; left: 6%; }
          .m-label { margin-bottom: 1.2rem; }
          .m-panel h1 { font-size: 2.2rem; margin-bottom: 1rem; }
          .m-panel p { font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.6; }
          .m-profile { margin-bottom: 1.5rem; gap: 12px; }
          .m-avatar { width: 44px; height: 44px; }
          .m-btn { width: 100%; justify-content: center; text-align: center; }
          .m-photo-badge { bottom: 1rem; left: 1rem; padding: 8px 14px; font-size: 0.75rem; }
        }
      `;
      document.head.appendChild(mStyle);

      const checkStatus = () => {
        fetch('https://mznzvxwzugimqzhhdnae.supabase.co/rest/v1/site_settings?select=is_maintenance_mode', {
          headers: { 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16bnp2eHd6dWdpbXF6aGhkbmFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5ODkzNjksImV4cCI6MjEwMTU2NTM2OX0.AL0sY92IZeP_vSyqYRoKoKkE3oMPvNYukNU3uNbJhWs' }
        }).then(r => r.json()).then(d => {
          const isM = d[0]?.is_maintenance_mode;
          let overlay = document.getElementById('nexus-maintenance-overlay');
          if (isM) {
            // MAINTENANCE ON: keep portfolio hidden, show overlay
            if (!overlay) {
              overlay = document.createElement('div');
              overlay.id = 'nexus-maintenance-overlay';
              overlay.innerHTML = `
                <div class="m-layout">
                  <div class="m-photo">
                    <div class="m-photo-badge">
                      <span class="m-pulse"></span>
                      Maintenance in Progress
                    </div>
                  </div>
                  <div class="m-panel">
                    <div class="m-wordmark">adhi.is-a.dev</div>
                    <div class="m-label">🔒 Maintenance in Progress</div>
                    <h1>Under Renovation</h1>
                    <p>We are currently enhancing our digital workspace to better serve you. Expect improvements and a refined experience very soon. We apologize for the brief interruption. Follow our progress.</p>
                    <div class="m-profile">
                      <img class="m-avatar" src="https://avatars.githubusercontent.com/u/154442004?v=4" alt="Adarsh B A">
                      <div>
                        <div class="m-profile-name">Adarsh B A</div>
                        <div class="m-profile-sub">Full-Stack Engineer</div>
                        <div class="m-profile-role">
                          <span class="m-online-dot"></span>
                          Available soon
                        </div>
                      </div>
                    </div>
                    <a href="mailto:contact@adhi.is-a.dev" class="m-btn">Contact Engineer</a>
                  </div>
                </div>
              `;
              document.body.appendChild(overlay);
            }
            overlay.classList.add('active');
            // DO NOT remove anti-flicker — keep portfolio hidden underneath
          } else {
            // MAINTENANCE OFF: reveal site, hide overlay
            const flicker = document.getElementById('maintenance-anti-flicker');
            if (flicker) flicker.remove();
            if (overlay) overlay.classList.remove('active');
          }
        }).catch(() => {
          // DB error: default to showing the site (don't block visitors)
          const flicker = document.getElementById('maintenance-anti-flicker');
          if (flicker) flicker.remove();
        });
      };

      checkStatus();
      setInterval(checkStatus, 5000);
      // Fallback ONLY if Supabase takes more than 3s — but only reveal site, never when maintenance is on
      // (This is handled inside checkStatus itself; no unconditional timeout needed)
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status | Adarsh B A</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .status-container { max-width: 800px; margin: 100px auto; padding: 20px; z-index: 10; position: relative; }
        .status-header { text-align: center; margin-bottom: 40px; }
        .system-overall { background: rgba(16, 185, 129, 0.1); border: 1px solid #10B981; border-radius: 8px; padding: 15px; text-align: center; color: #10B981; font-weight: bold; margin-bottom: 30px; }
        .service-list { display: flex; flex-direction: column; gap: 15px; }
        .service-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-radius: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.1); }
        .service-name { font-weight: 600; font-size: 1.1rem; }
        .service-metrics { display: flex; gap: 20px; font-family: 'Fira Code', monospace; font-size: 0.9rem; color: #94a3b8; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .status-up { background: rgba(16, 185, 129, 0.2); color: #10B981; }
        .status-down { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
        .status-checking { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
    </style>
</head>
<body style="background-color: #070709; color: white;">
    <div class="noise-overlay"></div>
    <div class="background-radial"></div>
    <nav class="navbar glass">
        <a href="/" class="nav-logo">← Back to Portfolio</a>
    </nav>
    <div class="status-container glass">
        <div class="status-header">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">System Status</h1>
            <p style="color: #94a3b8;">Real-time telemetry and uptime monitoring for active deployments.</p>
        </div>
        <div class="system-overall">
            All Systems Operational (99.99% Uptime)
        </div>
        
        <!-- Live Viewer Telemetry -->
        <div class="service-item" style="margin-bottom: 20px; border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.05);">
            <div style="display: flex; flex-direction: column;">
                <div class="service-name" style="display: flex; align-items: center; gap: 10px; color: #10B981;">
                    <div style="width:10px; height:10px; border-radius:50%; background:#10B981; box-shadow: 0 0 10px #10B981; animation: pulse 2s infinite;"></div>
                    Live Ecosystem Viewers
                </div>
                <div id="presence-list" style="margin-top: 10px; font-family: 'Fira Code', monospace; font-size: 0.85rem; color: #94a3b8; display: flex; flex-direction: column; gap: 5px;">
                    Establishing secure uplink...
                </div>
            </div>
            <div class="service-metrics" style="align-items: center;">
                <span id="presence-count" style="font-size: 1.8rem; color: #10B981; font-weight: 800; line-height: 1;">0</span>
                <span class="status-badge status-up" style="display: flex; align-items: center;">ACTIVE</span>
            </div>
        </div>

        <!-- Lifetime Views Telemetry -->
        <div class="service-item" style="margin-bottom: 30px; border-color: rgba(14, 165, 233, 0.4); background: rgba(14, 165, 233, 0.05);">
            <div style="display: flex; flex-direction: column;">
                <div class="service-name" style="display: flex; align-items: center; gap: 10px; color: #0EA5E9;">
                    <i data-feather="activity"></i> Lifetime Global Visits
                </div>
                <div style="margin-top: 10px; font-family: 'Fira Code', monospace; font-size: 0.85rem; color: #94a3b8;">
                    You have personally visited this site <strong id="personal-visits-count" style="color:#0EA5E9;">0</strong> times.
                </div>
            </div>
            <div class="service-metrics" style="align-items: center;">
                <span id="lifetime-count" style="font-size: 1.8rem; color: #0EA5E9; font-weight: 800; line-height: 1;">...</span>
                <span class="status-badge" style="background: rgba(14, 165, 233, 0.2); color: #0EA5E9; display: flex; align-items: center;">TOTAL HITS</span>
            </div>
        </div>

        <div class="service-list" id="services">
            <!-- Populated by JS -->
        </div>
    </div>
    <script>
        // Define the services to monitor
        const services = [
            { name: 'Core Portfolio Infrastructure', url: 'https://api.github.com/users/developeradhi' },
            { name: 'Sri Basaveswara School ERP API', url: 'https://api.github.com/repos/RootNode-Rebels/sribasaveswaraschool' },
            { name: 'RootNode-Rebels Authentication Service', url: 'https://api.github.com/users/developeradhi' } // Placeholder for actual service
        ];
        const serviceContainer = document.getElementById('services');
        services.forEach(async (service) => {
            // Create UI element
            const el = document.createElement('div');
            el.className = 'service-item';
            el.innerHTML = `
                <div class="service-name">${service.name}</div>
                <div class="service-metrics">
                    <span class="latency">Checking...</span>
                    <span class="status-badge status-checking">PENDING</span>
                </div>
            `;
            serviceContainer.appendChild(el);
            try {
                const start = performance.now();
                const res = await fetch(service.url, { method: 'GET', cache: 'no-cache' });
                const end = performance.now();
                const latency = Math.round(end - start);
                if (res.ok) {
                    el.querySelector('.latency').innerText = `${latency}ms`;
                    el.querySelector('.status-badge').className = 'status-badge status-up';
                    el.querySelector('.status-badge').innerText = 'OPERATIONAL';
                } else {
                    throw new Error('Non-200 response');
                }
            } catch (err) {
                el.querySelector('.latency').innerText = `Timeout`;
                el.querySelector('.status-badge').className = 'status-badge status-down';
                el.querySelector('.status-badge').innerText = 'DOWN';
            }
        });
    </script>
    <style>
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --- LIVE PRESENCE TRACKING WITH SUPABASE ---
        const SUPABASE_URL = 'https://elfoqjjblctmqrbxmpvx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZm9xampibGN0bXFyYnhtcHZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNDAzNDAsImV4cCI6MjA5OTYxNjM0MH0.nHwRJqLjMPDNxUci7Qq_FiTzRCZ4RN8PC1-6gBX5atY';
        
        if (typeof supabase !== 'undefined') {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const channel = supabaseClient.channel('portfolio-live-viewers', {
                config: {
                    presence: {
                        key: 'viewer_' + Math.random().toString(36).substr(2, 9),
                    },
                },
            });
            
            let localCity = 'Unknown Location';
            let localCountry = '';
            
            channel.on('presence', { event: 'sync' }, () => {
                const state = channel.presenceState();
                let totalViewers = 0;
                const locations = [];
                
                for (const id in state) {
                    state[id].forEach(viewer => {
                        totalViewers++;
                        if (viewer.city && viewer.city !== 'Unknown Location') {
                            locations.push(`• ${viewer.city}, ${viewer.country}`);
                        } else {
                            locations.push(`• Encrypted Viewer Node`);
                        }
                    });
                }
                
                const countEl = document.getElementById('presence-count');
                if (countEl) countEl.innerText = totalViewers;
                
                const listEl = document.getElementById('presence-list');
                if (listEl) {
                    if (locations.length === 0) {
                        listEl.innerHTML = 'Awaiting nodes...';
                    } else {
                        listEl.innerHTML = locations.join('<br>');
                    }
                }
            });

            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    try {
                        const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
                        const data = await res.json();
                        if (data.city) localCity = data.city;
                        if (data.country) localCountry = data.country;
                    } catch (e) {
                        console.log("Location fetch failed");
                    }
                    await channel.track({
                        city: localCity,
                        country: localCountry,
                        joined_at: new Date().toISOString()
                    });
                }
            });

            // FETCH TOTAL LIFETIME VIEWS
            async function fetchLifetimeViews() {
                try {
                    const { count, error } = await supabaseClient
                        .from('page_views')
                        .select('*', { count: 'exact', head: true });
                    
                    if (error) throw error;
                    document.getElementById('lifetime-count').innerText = count;
                } catch (e) {
                    console.log("Could not fetch total views. Is the page_views table setup?");
                    document.getElementById('lifetime-count').innerText = "N/A";
                }
            }
            fetchLifetimeViews();
        }

        // Display Personal Visits from localStorage
        const personalCount = parseInt(localStorage.getItem('personalVisits') || '0');
        document.getElementById('personal-visits-count').innerText = personalCount;

    </script>
</body>
</html>
